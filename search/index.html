<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск — KKazilaev_</title>
    <link rel="stylesheet" href="../global.css">
</head>
<body>

    <header class="nav">
        <a href="../home/" class="nav__logo">KKazilaev<span>_</span></a>
        <nav class="nav__menu">
            <a href="../languages/">Языки</a>
            <a href="../symbols/">Символы</a>
            <a href="../schemes/">Схемы</a>
            <a href="../search/" class="is-active">Поиск</a>
        </nav>
    </header>

    <main class="page">
        <h1 class="page__title">Поиск</h1>
        <p class="page__subtitle">Ищите сразу по языкам, терминологии, символам и схемам.</p>

        <div class="terms-search">
            <input id="q" type="text" placeholder="Что искать? Например: print, сортировка, ООП…" autocomplete="off" autofocus>
        </div>

        <div id="status" class="search-status"></div>
        <div id="results"></div>
    </main>

    <footer class="footer">
        <p>© 2026 KKazilaev_ · <a href="https://github.com/kkazilaev/pomoshkkazilaev" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script type="module">
        import { esc } from '../languages/render.js';

        /* =========================================================
           ИНДЕКС
           ========================================================= */

        let INDEX = [];
        let INDEX_READY = false;
        let INDEX_COUNTER = 0;
        let PENDING_QUERY = '';   // запрос, введённый во время индексации

        async function loadIndex() {
            const status = document.getElementById('status');
            status.textContent = 'Загрузка данных…';

            const langList = await fetchJson('../data/index.json');
            const items = (langList?.items || langList?.languages || []);

            const tasks = [];

            for (const item of items) {
                if (item.type === 'terms') {
                    tasks.push(loadTerms());
                } else {
                    tasks.push(loadLanguage(item));
                }
            }

            tasks.push(loadSymbols());
            tasks.push(loadSchemes());

            await Promise.all(tasks);

            INDEX_READY = true;
            status.textContent = `Готово. Проиндексировано ${INDEX.length} записей.`;
        }

        async function fetchJson(url) {
            try {
                const r = await fetch(url);
                return r.ok ? await r.json() : null;
            } catch { return null; }
        }

        /* ---- Языки ---- */
        async function loadLanguage(item) {
            const meta = await fetchJson(`../data/languages/${item.id}.json`);
            if (!meta) return;

            for (const mod of (meta.modules || [])) {
                const data = await fetchJson(`../data/languages/${item.id}/${mod}.json`);
                if (!data) continue;

                for (const entry of (data.items || [])) {
                    INDEX.push({
                        type:    'Язык',
                        section: `${meta.name} · ${data.title}`,
                        title:   entry.code,
                        desc:    entry.desc,
                        detail:  entry.detail,
                        url:     `../languages/lang.html?id=${item.id}`,
                        index:   INDEX_COUNTER++
                    });
                }
            }
        }

        /* ---- Терминология ---- */
        async function loadTerms() {
            const meta = await fetchJson('../data/terms/meta.json');
            if (!meta) return;

            for (const mod of (meta.modules || [])) {
                const data = await fetchJson(`../data/terms/${mod}.json`);
                if (!data) continue;

                for (const entry of (data.items || [])) {
                    INDEX.push({
                        type:    'Термин',
                        section: data.title,
                        title:   entry.code,
                        desc:    entry.desc,
                        detail:  entry.detail,
                        url:     `../languages/terms.html`,
                        index:   INDEX_COUNTER++
                    });
                }
            }
        }

        /* ---- Символы ---- */
        async function loadSymbols() {
            const meta = await fetchJson('../data/symbols/meta.json');
            if (!meta) return;

            for (const mod of (meta.modules || [])) {
                const data = await fetchJson(`../data/symbols/${mod}.json`);
                if (!data) continue;

                for (const entry of (data.items || [])) {
                    INDEX.push({
                        type:    'Символ',
                        section: data.title,
                        title:   entry.code,
                        desc:    entry.desc,
                        detail:  entry.detail,
                        url:     `../symbols/`,
                        index:   INDEX_COUNTER++
                    });
                }
            }
        }

        /* ---- Схемы ---- */
        async function loadSchemes() {
            const meta = await fetchJson('../data/schemes/meta.json');
            if (!meta) return;

            for (const lang of (meta.languages || [])) {
                const langMeta = await fetchJson(`../data/schemes/${lang.id}/meta.json`);
                if (!langMeta) continue;

                for (const mod of (langMeta.modules || [])) {
                    const data = await fetchJson(`../data/schemes/${lang.id}/${mod}.json`);
                    if (!data) continue;

                    for (const entry of (data.items || [])) {
                        INDEX.push({
                            type:    'Схема',
                            section: `${lang.name} · ${data.title}`,
                            title:   entry.desc,
                            desc:    entry.code.split('\n')[0],
                            detail:  entry.detail,
                            url:     `../schemes/index.html?lang=${lang.id}`,
                            index:   INDEX_COUNTER++
                        });
                    }
                }
            }
        }

        /* =========================================================
           ПОИСК
           ========================================================= */

        function search(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];

            const words = q.split(/\s+/);

            return INDEX
                .map(item => {
                    const haystack = (
                        item.title + ' ' +
                        item.desc  + ' ' +
                        (item.detail || '') + ' ' +
                        item.section
                    ).toLowerCase();

                    let score = 0;
                    for (const w of words) {
                        if (!haystack.includes(w)) return null;
                        if (item.title.toLowerCase().includes(w)) score += 10;
                        if (item.desc.toLowerCase().includes(w))  score += 5;
                        score += 1;
                    }

                    return { item, score };
                })
                .filter(Boolean)
                .sort((a, b) => b.score - a.score)
                .slice(0, 100)
                .map(x => x.item);
        }

        function renderResults(items, query) {
            const results = document.getElementById('results');

            if (!query.trim()) {
                results.innerHTML = '';
                return;
            }

            if (!items.length) {
                results.innerHTML = '<p class="empty">Ничего не найдено.</p>';
                return;
            }

            const groups = {};
            for (const item of items) {
                if (!groups[item.type]) groups[item.type] = [];
                groups[item.type].push(item);
            }

            results.innerHTML = Object.entries(groups).map(([type, list]) => `
                <section class="section">
                    <h2 class="section__title">${esc(type)} · ${list.length}</h2>
                    <div class="table">
                        ${list.map(item => {
                            const sep  = item.url.includes('?') ? '&' : '?';
                            const href = item.url
                                + sep + 'hl='  + encodeURIComponent(item.title)
                                + '&idx=' + item.index;
                            return `
                                <a class="row search-row" href="${href}">
                                    <div class="row__summary">
                                        <code class="row__code">${esc(item.title)}</code>
                                        <span class="row__desc">${esc(item.desc || '')}</span>
                                    </div>
                                    <div class="row__detail">
                                        <small>${esc(item.section)}</small>
                                    </div>
                                </a>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
        }

        /* =========================================================
           ЗАПУСК
           ========================================================= */

        function runSearch(query) {
            const found = search(query);
            renderResults(found, query);
        }

        async function init() {
            const input = document.getElementById('q');
            let timer;

            /* Слушатели навешиваем СРАЗУ, до индексации */

            input.addEventListener('input', function () {
                const q = this.value;

                if (!INDEX_READY) {
                    PENDING_QUERY = q;
                    return;
                }

                clearTimeout(timer);
                timer = setTimeout(() => runSearch(q), 150);
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    const q = this.value;

                    if (!INDEX_READY) {
                        PENDING_QUERY = q;
                        return;
                    }

                    clearTimeout(timer);
                    runSearch(q);
                }
            });

            /* Запускаем индексацию */
            await loadIndex();

            /* Если пользователь что-то печатал во время индексации — применяем */
            if (PENDING_QUERY) {
                runSearch(PENDING_QUERY);
                PENDING_QUERY = '';
            }
        }

        init();
    </script>

</body>
</html>
