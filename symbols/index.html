<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Символы — KK ArsDev</title>
    <link rel="stylesheet" href="../global.css">
</head>
<body>

    <header class="nav">
        <a href="../home/" class="nav__logo">KK ArsDev<span>_</span></a>
        <nav class="nav__menu">
            <a href="../languages/">Языки</a>
            <a href="../symbols/" class="is-active">Символы</a>
            <a href="../schemes/">Схемы</a>
            <a href="../search/">Поиск</a>
        </nav>
    </header>

    <main class="page">
        <a class="back" href="../home/">← На главную</a>
        <div id="content">
            <p class="loading-inline">Загрузка…</p>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 KKazilaev_ · <a href="https://github.com/kkazilaev/pomoshkkazilaev" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script type="module">
        import { esc, renderSections, loadModules } from '../languages/render.js';

        async function load() {
            const content = document.getElementById('content');

            try {
                const metaRes = await fetch('../data/symbols/meta.json');
                if (!metaRes.ok) throw new Error('404');
                const meta = await metaRes.json();

                document.title = `${meta.name} — KKazilaev_`;

                const sections = await loadModules(
                    '../data/symbols/',
                    meta.modules || []
                );

                content.innerHTML = `
                    <h1 class="page__title">${esc(meta.name)}</h1>
                    <p class="page__subtitle">${esc(meta.description)}</p>

                    <div class="terms-search">
                        <input id="filter" type="text" placeholder="Поиск по символам…" autocomplete="off">
                    </div>

                    <div id="sections"></div>
                `;

                renderSections(
                    document.getElementById('sections'),
                    sections
                );

                const input = document.getElementById('filter');
                input.addEventListener('input', function () {
                    const q = this.value.trim().toLowerCase();

                    document.querySelectorAll('.row').forEach(row => {
                        const text = row.textContent.toLowerCase();
                        row.style.display = (!q || text.includes(q)) ? '' : 'none';
                    });

                    document.querySelectorAll('.section').forEach(sec => {
                        const visible = sec.querySelectorAll('.row:not([style*="display: none"])').length;
                        sec.style.display = visible ? '' : 'none';
                    });
                });

            } catch (e) {
                content.innerHTML = '<p class="empty">Не удалось загрузить символы.</p>';
                console.error(e);
            }
        }

        load();

        renderSections(document.getElementById('sections'), sections);

        // Подсветить объект, если пришли из поиска
        highlightFromUrl();
    </script>

</body>
</html>
